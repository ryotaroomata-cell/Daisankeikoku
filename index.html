<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最強の門番アプリ</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #1a1a1a; color: white; padding: 50px 20px; }
        .card { background: #2a2a2a; padding: 30px; border-radius: 20px; }
        .status { font-size: 1.2rem; font-weight: bold; margin: 20px 0; padding: 10px; border-radius: 10px; }
        .locked { background-color: #ff4d4d; }
        .unlocked { background-color: #2ecc71; }
        button { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 10px; border: none; cursor: pointer; }
        .btn-main { background-color: #007bff; color: white; margin-top: 20px; }
        .btn-reset { background-color: #444; color: #aaa; margin-top: 50px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>修行の門番</h1>
        <div id="status-display" class="status locked">判定中...</div>
        <p id="msg">修行が終わるまでSNSは使わせん。</p>
        <button id="main-btn" class="btn-main" onclick="finishTraining()">修行完了（封印を解く）</button>
        <button class="btn-reset" onclick="resetApp()">デバッグ用：強制ロック</button>
    </div>

    <script>
        // SNSのURL（ここを自分のよく使うSNSに変えてもいい）
        const SNS_URL = "https://twitter.com"; 

        window.onload = function() {
            const status = localStorage.getItem('isDone');
            const display = document.getElementById('status-display');
            const msg = document.getElementById('msg');

            if (status === 'true') {
                display.innerText = "🔓 解放中：SNSへ転送するぞ";
                display.className = "status unlocked";
                msg.innerText = "3秒後にSNSへ戻る。そのまま待て。";
                
                // --- 【ここが重要！】解放中なら自動でSNSへ飛ばす ---
                setTimeout(() => {
                    window.location.href = SNS_URL;
                }, 2000); // 2秒後に実行
            } else {
                display.innerText = "🔒 封印中：修行を終えろ";
                display.className = "status locked";
            }
        };

        function finishTraining() {
            localStorage.setItem('isDone', 'true');
            alert("記録した！SNSへ送り返してやる。");
            location.reload(); 
        }

        function resetApp() {
            localStorage.removeItem('isDone');
            alert("封印し直した。");
            location.reload();
        }
    </script>
</body>
</html>
