<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修行の門番（アプリ版対応）</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #1a1a1a; color: white; padding: 50px 20px; }
        .card { background: #2a2a2a; padding: 30px; border-radius: 20px; }
        .unlocked-btn { display: block; width: 100%; padding: 20px; background: #2ecc71; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; margin-top: 20px; font-size: 20px; }
        .status { font-size: 1.5rem; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>修行の門番</h1>
        <div id="status">判定中...</div>
    </div>

    <script>
        // 【重要】アプリを直接開くための「URLスキーム」リスト
        const APP_SCHEMES = {
            'twitter': 'twitter://timeline',
            'instagram': 'instagram://app',
            'youtube': 'youtube://',
            'tiktok': 'snssdk1180://'
        };

        window.onload = function() {
            const isDone = localStorage.getItem('isDone');
            const params = new URLSearchParams(window.location.search);
            const fromApp = params.get('from');
            const div = document.getElementById('status');

            if (isDone === 'true') {
                const targetApp = APP_SCHEMES[fromApp] || 'https://google.com';
                div.innerHTML = `
                    <p class="status" style="color:#2ecc71">🔓 修行完了！</p>
                    <a href="${targetApp}" class="unlocked-btn">アプリに戻る</a>
                    <p style="font-size:12px; color:#aaa; margin-top:20px;">
                        ※ボタンを押しても反応しない場合は<br>
                        そのアプリがスマホに入っているか確認しろ。
                    </p>
                `;
                // 自動で飛ばそうとすると無限ループの危険があるから、
                // 「アプリに戻る」だけは手動でボタンを押させるのが一番安全だ。
            } else {
                div.innerHTML = `
                    <p class="status" style="color:#ff4d4d">🔒 封印中</p>
                    <p>野球と中国語、終わったのか？</p>
                    <button onclick="localStorage.setItem('isDone','true');location.reload();" style="width:100%;padding:15px;font-size:18px;">終わった！（封印を解く）</button>
                `;
            }
        };
    </script>
</body>
</html>
