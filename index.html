<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修行の門番</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #1a1a1a; color: white; padding: 50px 20px; }
        .card { background: #2a2a2a; padding: 30px; border-radius: 20px; }
        .unlocked-btn { display: block; width: 100%; padding: 20px; background: #2ecc71; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>修行の門番</h1>
        <div id="status">判定中...</div>

        <script>
            const REDIRECT_MAP = {
                'twitter': 'https://x.com',
                'instagram': 'https://www.instagram.com'
            };

            window.onload = function() {
                const isDone = localStorage.getItem('isDone');
                const params = new URLSearchParams(window.location.search);
                const fromApp = params.get('from');
                const div = document.getElementById('status');

                if (isDone === 'true') {
                    const targetUrl = REDIRECT_MAP[fromApp] || 'https://google.com';
                    div.innerHTML = `
                        <p style="color:#2ecc71">🔓 修行完了！</p>
                        <a href="${targetUrl}" class="unlocked-btn">ここを押してSNSへ戻る</a>
                        <p style="font-size:12px; color:#aaa; margin-top:10px;">※自動で飛ばない場合は上を押せ</p>
                    `;
                    // 自動で飛ぶ挑戦も一応する
                    setTimeout(() => { window.location.href = targetUrl; }, 1000);
                } else {
                    div.innerHTML = `
                        <p style="color:#ff4d4d">🔒 封印中</p>
                        <button onclick="localStorage.setItem('isDone','true');location.reload();" style="width:100%;padding:15px;">修行が終わったらここを押せ</button>
                    `;
                }
            };
        </script>
    </div>
</body>
</html>
